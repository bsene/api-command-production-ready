# =============================================================================
# Taskfile — QA smoke verification (Hurl)
# =============================================================================
#
# Audience: QA engineers.
#
# These tasks run the smoke scenarios in smoke-tests/*.hurl with the `hurl`
# tool against a REAL server process. By default the Taskfile boots the local
# products API fixture (the dune-built products-api executable) on a live
# localhost port, runs Hurl against it, then tears it down. Set BASE_URL to
# point at a deployed instance instead (e.g. https://products.com) to
# smoke-test that environment.
#
# They answer:
#
#     "If we deploy this, does the products API actually serve the contract
#      the OrdersManager client depends on?"
#
# Prerequisites:
#   - OCaml toolchain on PATH (`dune`) — to build the local fixture server
#   - `hurl` on PATH (https://hurl.dev)
#   - `task` runner installed (https://taskfile.dev)
#   - the environment must allow binding a localhost port
#
# Quick start:
#     task            # list available tasks
#     task smoke      # run every smoke scenario, verbose
#     task smoke:list # run each scenario individually with a PASS/FAIL summary
#
# =============================================================================
version: "3"

vars:
  # Directory containing the Hurl smoke scenarios.
  SMOKE_DIR: smoke-tests
  # Production Lambda Function URL (not a secret; the key is via LAMBDA_API_KEY).
  PROD_URL: https://53t5kzpvzcxwyvhvowljmmx5oy0ulcdo.lambda-url.eu-north-1.on.aws/
  # Port the local products API fixture binds when BASE_URL is not set.
  PORT: "18080"
  # API key shared between the local fixture (-api-key) and Hurl (--variable).
  API_KEY: "smoke-test-key"
  # Shared product catalog JSON (single source of truth for all fixtures).
  CATALOG: infra/catalog/products.json
  # Local products API fixture binary + runtime files (built once, reused).
  SERVER_BIN: /tmp/products-api-smoke
  SERVER_LOG: /tmp/products-api-smoke.log
  SERVER_PID: /tmp/products-api-smoke.pid
  # Infrastructure (Pulumi AWS) project directory.
  INFRA_DIR: infra
  # ── Load testing (vegeta) — targets ONLY the Lambda Function URL ──
  LOAD_DIR: load-tests
  LOAD_URL: "{{.PROD_URL}}"
  LOAD_RESULTS: load-tests/results
  LOAD_GEN: load-tests/results/.gen
  # ── Security scanning ──
  SECURITY_RESULTS: security-results
  GGSHIELD_JSON: "{{.SECURITY_RESULTS}}/ggshield.json"
  TRIVY_FS_JSON: "{{.SECURITY_RESULTS}}/trivy-fs.json"
  TRIVY_IAC_JSON: "{{.SECURITY_RESULTS}}/trivy-iac.json"

tasks:

  # ------------------------------------------------------------------ default
  default:
    desc: List the available QA smoke tasks.
    cmds:
      - task --list

  # ------------------------------------------------------------------ smoke
  smoke:
    desc: Run ALL smoke scenarios with Hurl plus the client integration test.
    summary: |
      Boots the products API fixture (or uses BASE_URL), then runs every
      smoke-tests/*.hurl scenario with `hurl --test` and the OCaml client
      integration test. Use this as the gate before sign-off.
    cmds:
      - cmd: |
          set -euo pipefail
          task smoke:server:start
          trap 'task smoke:server:stop >/dev/null 2>&1 || true' EXIT
          task smoke:run
          task integration:client

  smoke:list:
    desc: Run each smoke scenario individually and print a PASS/FAIL summary.
    summary: |
      Runs the scenarios one by one so a QA engineer can see exactly which
      scenario failed, then prints a consolidated PASS/FAIL summary.
    cmds:
      - cmd: |
          set -euo pipefail
          task smoke:server:start
          trap 'task smoke:server:stop >/dev/null 2>&1 || true' EXIT
          base_url="${BASE_URL:-http://127.0.0.1:{{.PORT}}}"
          pass=0
          fail=0
          for f in {{.SMOKE_DIR}}/*.hurl; do
            name=$(basename "$f" .hurl)
            echo ""
            echo "────────────────────────────────────────────────────────────"
            echo "▶ Scenario $name"
            echo "────────────────────────────────────────────────────────────"
            if hurl --test --max-time 10 --variable base_url="$base_url" --variable api_key="{{.API_KEY}}" "$f"; then
              echo "✅ PASS  $name"
              pass=$((pass + 1))
            else
              echo "❌ FAIL  $name"
              fail=$((fail + 1))
            fi
          done
          echo ""
          echo "Summary: $pass passed, $fail failed"
          [ "$fail" -eq 0 ]

  # ------------------------------------------------------------- server mgmt
  smoke:server:start:
    desc: Boot the products API fixture in the background (skipped when BASE_URL is set).
    cmds:
      - cmd: |
          set -euo pipefail
          if [ -n "${BASE_URL:-}" ]; then
            echo "BASE_URL set ($BASE_URL) — using external server, not booting the local fixture."
            exit 0
          fi
          if [ -f {{.SERVER_PID}} ] && kill -0 "$(cat {{.SERVER_PID}})" 2>/dev/null; then
            echo "products API fixture already running (pid $(cat {{.SERVER_PID}}))."
            exit 0
          fi
          dune build server/main.exe
          install -m 755 _build/default/server/main.exe {{.SERVER_BIN}}
          # Reap any stale fixture still bound to our port: the readiness check
          # below would otherwise be satisfied by a leftover process and the
          # recorded PID would not match the server actually answering.
          pkill -f "{{.SERVER_BIN}} --addr 127.0.0.1:{{.PORT}}" 2>/dev/null || true
          {{.SERVER_BIN}} --addr 127.0.0.1:{{.PORT}} --api-key {{.API_KEY}} --catalog {{.CATALOG}} > {{.SERVER_LOG}} 2>&1 &
          echo $! > {{.SERVER_PID}}
          for i in $(seq 1 50); do
            if curl -fsS -H "x-api-key: {{.API_KEY}}" "http://127.0.0.1:{{.PORT}}/products" >/dev/null 2>&1; then
              echo "products API fixture ready on http://127.0.0.1:{{.PORT}}"
              exit 0
            fi
            sleep 0.1
          done
          echo "products API fixture failed to become ready; log:" >&2
          cat {{.SERVER_LOG}} >&2 || true
          exit 1

  smoke:server:stop:
    desc: Stop the products API fixture (no-op when BASE_URL is set).
    cmds:
      - cmd: |
          set -euo pipefail
          if [ -n "${BASE_URL:-}" ]; then
            exit 0
          fi
          if [ -f {{.SERVER_PID}} ]; then
            pid=$(cat {{.SERVER_PID}})
            kill "$pid" 2>/dev/null || true
            rm -f {{.SERVER_PID}}
          fi
          # Fallback: ensure nothing is left bound to our port even if the PID
          # was never recorded (e.g. a stale process from an interrupted run).
          pkill -f "{{.SERVER_BIN}} --addr 127.0.0.1:{{.PORT}}" 2>/dev/null || true
          echo "products API fixture stopped."

  # ------------------------------------------------------------- smoke:run
  smoke:run:
    desc: Run every Hurl scenario against the server.
    cmds:
      - cmd: |
          set -euo pipefail
          base_url="${BASE_URL:-http://127.0.0.1:{{.PORT}}}"
          hurl --test --max-time 10 --variable base_url="$base_url" --variable api_key="{{.API_KEY}}" {{.SMOKE_DIR}}/*.hurl

  # ------------------------------------------------------------- integration:client
  integration:client:
    desc: Run the OCaml Orders_manager client against the live fixture.
    summary: |
      Builds integration/client_smoke.exe and drives the real Orders_manager
      client (via the SSRF-safe Cohttp_backend) against the already-booted
      fixture, asserting the catalog contract and the A01 client↔server auth
      gate.
    cmds:
      - cmd: |
          set -euo pipefail
          dune build integration/client_smoke.exe
          base_url="${BASE_URL:-http://127.0.0.1:{{.PORT}}}"
          _build/default/integration/client_smoke.exe --base-url "$base_url" --api-key "{{.API_KEY}}"

  # ------------------------------------------------------------------ support
  smoke:vet:
    desc: Run the Alcotest suites (server fixture + client) without booting a server.
    cmds:
      - cmd: |
          set -euo pipefail
          # A04-A10 SSRF confinement: the SSRF-bypass labelled arg `~http_client:`
          # may appear only in tests (lib/test/**) and the integration smoke
          # (integration/** uses the *real* Cohttp_backend, not a bypass). Any
          # other production file carrying it is a violation.
          bad=$(rg -n --glob '!lib/test/**' --glob '!integration/**' '~http_client:' lib/ server/ lambda/ infra/ || true)
          if [ -n "$bad" ]; then
            echo "smoke:vet: ~http_client: SSRF bypass found outside tests/integration:" >&2
            echo "$bad" >&2
            exit 1
          fi
      - dune runtest

  smoke:count:
    desc: Show how many smoke scenarios are defined.
    cmds:
      - |
        n=$(ls {{.SMOKE_DIR}}/*.hurl 2>/dev/null | wc -l | tr -d ' ')
        echo "Smoke scenarios defined: $n"
  # ------------------------------------------------------------------ smoke:prod
  smoke:prod:
    desc: Run production smoke scenarios against the deployed Lambda Function URL.
    summary: |
      Sends HTTP requests to the real AWS Lambda Function URL provisioned by
      infra/src/index.ts. Requires the LAMBDA_API_KEY environment variable
      (the Pulumi secret) because the handler authenticates every request.
      This is the post-deploy gate: if these fail, the production endpoint
      is broken and the full suite should not run.
    cmds:
      - cmd: |
          set -euo pipefail
          if [ -z "${LAMBDA_API_KEY:-}" ]; then
            echo "LAMBDA_API_KEY environment variable is required to run production smoke tests." >&2
            exit 1
          fi
          # Explicit order: lambda-rate-limited.hurl must run last. The global
          # unauth bucket is shared across all key-less scenarios; running the
          # rate-limit scenario first would starve the others.
          hurl --test --max-time 30 --variable base_url="{{.PROD_URL}}" --variable api_key="$LAMBDA_API_KEY" \
            {{.SMOKE_DIR}}/prod/lambda-catalog.hurl \
            {{.SMOKE_DIR}}/prod/lambda-availability-in-stock.hurl \
            {{.SMOKE_DIR}}/prod/lambda-availability-out-of-stock.hurl \
            {{.SMOKE_DIR}}/prod/lambda-base64-body.hurl \
            {{.SMOKE_DIR}}/prod/lambda-malformed-body.hurl \
            {{.SMOKE_DIR}}/prod/lambda-missing-body.hurl \
            {{.SMOKE_DIR}}/prod/lambda-negative-price.hurl \
            {{.SMOKE_DIR}}/prod/lambda-negative-ref.hurl \
            {{.SMOKE_DIR}}/prod/lambda-oversize-description.hurl \
            {{.SMOKE_DIR}}/prod/lambda-unauthorized.hurl \
            {{.SMOKE_DIR}}/prod/lambda-wrong-key.hurl \
            {{.SMOKE_DIR}}/prod/lambda-zero-price-ref.hurl \
            {{.SMOKE_DIR}}/prod/production.hurl \
            {{.SMOKE_DIR}}/prod/lambda-rate-limited.hurl

  smoke:prod:list:
    desc: Run each production smoke scenario individually with a PASS/FAIL summary.
    summary: |
      Same contract as smoke:prod, but runs the scenarios one by one so the
      failing scenario is obvious. Exits non-zero if any scenario fails.
      The rate-limit scenario is run last so the shared global bucket does not
      starve earlier key-less scenarios.
    cmds:
      - cmd: |
          set -euo pipefail
          if [ -z "${LAMBDA_API_KEY:-}" ]; then
            echo "LAMBDA_API_KEY environment variable is required to run production smoke tests." >&2
            exit 1
          fi
          pass=0
          fail=0
          run() {
            f="$1"
            name=$(basename "$f" .hurl)
            echo ""
            echo "────────────────────────────────────────────────────────────"
            echo "▶ Production scenario $name"
            echo "────────────────────────────────────────────────────────────"
            if hurl --test --max-time 30 --variable base_url="{{.PROD_URL}}" --variable api_key="$LAMBDA_API_KEY" "$f"; then
              echo "✅ PASS  $name"
              pass=$((pass + 1))
            else
              echo "❌ FAIL  $name"
              fail=$((fail + 1))
            fi
          }
          run {{.SMOKE_DIR}}/prod/lambda-catalog.hurl
          run {{.SMOKE_DIR}}/prod/lambda-availability-in-stock.hurl
          run {{.SMOKE_DIR}}/prod/lambda-availability-out-of-stock.hurl
          run {{.SMOKE_DIR}}/prod/lambda-base64-body.hurl
          run {{.SMOKE_DIR}}/prod/lambda-malformed-body.hurl
          run {{.SMOKE_DIR}}/prod/lambda-missing-body.hurl
          run {{.SMOKE_DIR}}/prod/lambda-negative-price.hurl
          run {{.SMOKE_DIR}}/prod/lambda-negative-ref.hurl
          run {{.SMOKE_DIR}}/prod/lambda-oversize-description.hurl
          run {{.SMOKE_DIR}}/prod/lambda-unauthorized.hurl
          run {{.SMOKE_DIR}}/prod/lambda-wrong-key.hurl
          run {{.SMOKE_DIR}}/prod/lambda-zero-price-ref.hurl
          run {{.SMOKE_DIR}}/prod/production.hurl
          run {{.SMOKE_DIR}}/prod/lambda-rate-limited.hurl
          echo ""
          echo "Production summary: $pass passed, $fail failed"
          [ "$fail" -eq 0 ]

  smoke:prod:url:
    desc: Show the production Lambda Function URL used by smoke:prod.
    cmds:
      - echo "{{.PROD_URL}}"
  # ------------------------------------------------------------------ deploy
  deploy:
    desc: Build the Lambda artefact and deploy the stack with Pulumi.
    summary: |
      One-shot production deploy: builds dist/lambda.zip (and the catalog
      layer) under infra/, then runs `pulumi up` against the dev stack.

      Requires the local-backend prerequisites documented in infra/README.md:
        export PULUMI_CONFIG_PASSPHRASE="api-command-local-dev"
        export AWS_PROFILE=default
    cmds:
      - task: deploy:build
      - task: deploy:up

  deploy:build:
    desc: Build the Lambda deployment artefact (dist/lambda.zip + catalog layer).
    summary: |
      Runs `npm run build` inside infra/, which cross-compiles the OCaml Lambda
      handler to linux/arm64 via `Dockerfile.lambda` (Docker buildx), extracts
      the `bootstrap` binary, zips it to dist/lambda.zip, and packages the
      shared catalog into dist/catalog-layer.zip. Must run before `pulumi up`
      so the Function asset points at a fresh artefact. Requires Docker with
      the buildx plugin (not Go).
    cmds:
      - cmd: |
          set -euo pipefail
          cd {{.INFRA_DIR}}
          npm run build

  deploy:up:
    desc: Deploy the current stack with `pulumi up` (artefact must be built).
    summary: |
      Runs `pulumi up` inside infra/. Assumes deploy:build (or `npm run build`)
      has already produced dist/lambda.zip; `pulumi up` will upload it to AWS
      and create/update the Lambda Function, IAM role, and Function URL.
    cmds:
      - cmd: |
          set -euo pipefail
          if [ -z "${PULUMI_CONFIG_PASSPHRASE:-}" ]; then
            echo "PULUMI_CONFIG_PASSPHRASE is required for the local backend (see infra/README.md)." >&2
            exit 1
          fi
          cd {{.INFRA_DIR}}
          pulumi up --yes

  deploy:preview:
    desc: Build the artefact and run `pulumi preview` (no changes applied).
    summary: |
      Dry-run equivalent of `deploy`: rebuilds dist/lambda.zip so the preview
      reflects any code changes, then runs `pulumi preview` to show the
      planned diff without touching AWS resources.
    cmds:
      - cmd: |
          set -euo pipefail
          if [ -z "${PULUMI_CONFIG_PASSPHRASE:-}" ]; then
            echo "PULUMI_CONFIG_PASSPHRASE is required for the local backend (see infra/README.md)." >&2
            exit 1
          fi
          cd {{.INFRA_DIR}}
          npm run build
          pulumi preview

  # ------------------------------------------------------------------ load
  # Load testing (vegeta) — targets ONLY the deployed Lambda Function URL.
  # Never touches the local Dream fixture (server/), BASE_URL, or PORT.
  load:
    desc: Run the safe load suite (baseline + availability + soak) against the Lambda Function URL.
    summary: |
      Runs the three under-capacity vegeta scenarios (baseline, availability,
      soak) against the deployed Lambda Function URL. Spike and throttle are
      deliberately excluded: they are opt-in (task load:spike / task load:throttle)
      so the default suite can never self-DoS the production endpoint.
    cmds:
      - task: load:baseline
      - task: load:availability
      - task: load:soak

  load:check:
    desc: Verify prerequisites for load testing (LAMBDA_API_KEY, vegeta, envsubst).
    cmds:
      - cmd: |
          set -euo pipefail
          if [ -z "${LAMBDA_API_KEY:-}" ]; then echo "LAMBDA_API_KEY required (same gate as smoke:prod)." >&2; exit 1; fi
          command -v vegeta >/dev/null 2>&1 || { echo "vegeta not found. Install: go install github.com/tsenart/vegeta/v2@latest (or brew install vegeta)" >&2; exit 1; }
          command -v envsubst >/dev/null 2>&1 || { echo "envsubst not found. Install: brew install gettext (or apt install gettext-base)" >&2; exit 1; }

  load:targets:
    desc: Render the vegeta target templates into LOAD_GEN (internal).
    cmds:
      - cmd: |
          set -euo pipefail
          mkdir -p {{.LOAD_GEN}} {{.LOAD_RESULTS}}
          export LOAD_URL="{{.LOAD_URL}}" LAMBDA_API_KEY="$LAMBDA_API_KEY" REPO_ROOT="$(pwd)"
          for tmpl in {{.LOAD_DIR}}/targets/*.http.tmpl; do
            envsubst < "$tmpl" > "{{.LOAD_GEN}}/$(basename "$tmpl" .tmpl)"
          done

  load:baseline:
    desc: Baseline — GET /products at 1 rps for 10s (expect 100% 200, no 429).
    deps:
      - load:check
      - load:targets
    cmds:
      - cmd: |
          set -euo pipefail
          vegeta attack -targets={{.LOAD_GEN}}/get-products.http -rate=1 -duration=10s -workers=1 > {{.LOAD_RESULTS}}/baseline.bin
          vegeta report -type=text < {{.LOAD_RESULTS}}/baseline.bin | tee {{.LOAD_RESULTS}}/baseline.txt
          vegeta plot -title="baseline" < {{.LOAD_RESULTS}}/baseline.bin > {{.LOAD_RESULTS}}/baseline.html

  load:availability:
    desc: Availability — POST / at 1 rps for 10s (expect 100% 200, no 429).
    deps:
      - load:check
      - load:targets
    cmds:
      - cmd: |
          set -euo pipefail
          vegeta attack -targets={{.LOAD_GEN}}/post-availability.http -rate=1 -duration=10s -workers=1 > {{.LOAD_RESULTS}}/availability.bin
          vegeta report -type=text < {{.LOAD_RESULTS}}/availability.bin | tee {{.LOAD_RESULTS}}/availability.txt
          vegeta plot -title="availability" < {{.LOAD_RESULTS}}/availability.bin > {{.LOAD_RESULTS}}/availability.html

  load:soak:
    desc: Soak — mixed GET/POST at 2 rps for 120s (expect ~100% 200, no 429).
    deps:
      - load:check
      - load:targets
    cmds:
      - cmd: |
          set -euo pipefail
          vegeta attack -targets={{.LOAD_GEN}}/soak-mixed.http -rate=2 -duration=120s -workers=2 > {{.LOAD_RESULTS}}/soak.bin
          vegeta report -type=text < {{.LOAD_RESULTS}}/soak.bin | tee {{.LOAD_RESULTS}}/soak.txt
          vegeta plot -title="soak" < {{.LOAD_RESULTS}}/soak.bin > {{.LOAD_RESULTS}}/soak.html

  load:spike:
    desc: Spike — GET /products at 20 rps for 5s (expect mostly 200). Opt-in.
    summary: |
      WARNING: this scenario pushes the Lambda above its reserved concurrency
      and may produce 429s. It is excluded from `task load` on purpose.
    deps:
      - load:check
      - load:targets
    cmds:
      - cmd: |
          set -euo pipefail
          echo "WARNING: spike scenario — may exceed reservedConcurrency and produce 429s." >&2
          vegeta attack -targets={{.LOAD_GEN}}/get-products.http -rate=20 -duration=5s -workers=5 > {{.LOAD_RESULTS}}/spike.bin
          vegeta report -type=text < {{.LOAD_RESULTS}}/spike.bin | tee {{.LOAD_RESULTS}}/spike.txt
          vegeta plot -title="spike" < {{.LOAD_RESULTS}}/spike.bin > {{.LOAD_RESULTS}}/spike.html

  load:throttle:
    desc: Throttle — unauth GET /products at 50 rps for 5s (EXPECTS 429; validates the unauth-only DoS guard). Opt-in.
    summary: |
      WARNING: this scenario deliberately sends key-less traffic to confirm
      the app-level unauth-only fixed-window limiter throttles with HTTP 429.
      A 0% 429 result means the guard is inactive — investigate. Excluded from
      `task load`.
    deps:
      - load:check
      - load:targets
    cmds:
      - cmd: |
          set -euo pipefail
          echo "WARNING: throttle scenario — expects a large 429 fraction (unauth-only DoS guard active)." >&2
          vegeta attack -targets={{.LOAD_GEN}}/get-products-unauth.http -rate=50 -duration=5s -workers=5 > {{.LOAD_RESULTS}}/throttle.bin
          vegeta report -type=text < {{.LOAD_RESULTS}}/throttle.bin | tee {{.LOAD_RESULTS}}/throttle.txt
          vegeta plot -title="throttle" < {{.LOAD_RESULTS}}/throttle.bin > {{.LOAD_RESULTS}}/throttle.html

  load:auth:
    desc: Auth — authenticated GET /products at 4 rps for 30s (expects ~0% app-level 429s; reserved-concurrency throttling out of scope). Opt-in.
    summary: |
      Regression sentinel: authenticated traffic must not hit the unauth-only
      app-level rate limiter. Reserved-concurrency platform throttling, if it
      occurs, surfaces as platform 429s and is intentionally out of scope.
    deps:
      - load:check
      - load:targets
    cmds:
      - cmd: |
          set -euo pipefail
          echo "Auth scenario — expects ~0% app-level 429s (reserved-concurrency throttling out of scope)." >&2
          vegeta attack -targets={{.LOAD_GEN}}/get-products.http -rate=4 -duration=30s -workers=2 > {{.LOAD_RESULTS}}/auth.bin
          vegeta report -type=text < {{.LOAD_RESULTS}}/auth.bin | tee {{.LOAD_RESULTS}}/auth.txt
          vegeta plot -title="auth" < {{.LOAD_RESULTS}}/auth.bin > {{.LOAD_RESULTS}}/auth.html

  load:list:
    desc: Run every load scenario and print a PASS/FAIL gate (exits non-zero on violation).
    summary: |
      Runs all six scenarios, then asserts the 429 expectation per scenario:
      under-cap / authenticated scenarios (baseline, availability, soak, spike,
      auth) must have zero app-level 429s; the unauth-only throttle scenario
      must have at least one 429. Prints ✅/❌ per scenario and exits non-zero
      if any expectation is violated.
    deps:
      - load:check
      - load:targets
    cmds:
      - cmd: |
          set -euo pipefail
          run() {
            name="$1"; want429="$2"; shift 2
            vegeta attack "$@" > "{{.LOAD_RESULTS}}/$name.bin"
            vegeta report -type=text < "{{.LOAD_RESULTS}}/$name.bin" | tee "{{.LOAD_RESULTS}}/$name.txt"
            vegeta plot -title="$name" < "{{.LOAD_RESULTS}}/$name.bin" > "{{.LOAD_RESULTS}}/$name.html"
            codes=$(grep "Status Codes" "{{.LOAD_RESULTS}}/$name.txt")
            n429=$(echo "$codes" | grep -o "429:[0-9]*" | cut -d: -f2)
            n429=${n429:-0}
            if [ "$want429" = "yes" ]; then
              if [ "$n429" -gt 0 ]; then echo "✅ PASS  $name (429 present: $n429)"; else echo "❌ FAIL  $name (expected 429, got 0)"; return 1; fi
            else
              if [ "$n429" -eq 0 ]; then echo "✅ PASS  $name (no 429)"; else echo "❌ FAIL  $name (unexpected 429: $n429)"; return 1; fi
            fi
          }
          fail=0
          run baseline no -targets={{.LOAD_GEN}}/get-products.http -rate=1 -duration=10s -workers=1 || fail=1
          run availability no -targets={{.LOAD_GEN}}/post-availability.http -rate=1 -duration=10s -workers=1 || fail=1
          run soak no -targets={{.LOAD_GEN}}/soak-mixed.http -rate=2 -duration=120s -workers=2 || fail=1
          run spike no -targets={{.LOAD_GEN}}/get-products.http -rate=20 -duration=5s -workers=5 || fail=1
          run auth no -targets={{.LOAD_GEN}}/get-products.http -rate=4 -duration=30s -workers=2 || fail=1
          run throttle yes -targets={{.LOAD_GEN}}/get-products-unauth.http -rate=50 -duration=5s -workers=5 || fail=1
          [ "$fail" -eq 0 ]

  load:url:
    desc: Show the Lambda Function URL targeted by the load tests.
    cmds:
      - echo "{{.LOAD_URL}}"

  load:clean:
    desc: Remove generated load-test results and rendered targets.
    cmds:
      - rm -rf {{.LOAD_RESULTS}}

  # ------------------------------------------------------------------ security
  # Security scanning gate: ggshield (secrets) + trivy (fs-vulns/IaC)
  # + OWASP Top 10 checklist covering all ten 2021 items.
  check:security:
    desc: "Run every security scan (ggshield + trivy + OWASP Top 10) and report findings."
    summary: |
      Runs the security gate: ggshield for secret scan, trivy for filesystem
      vulns + IaC config audit, then a checklist validating OWASP Top 10 (2021)
      coverage. Exits 0 only if every check passes.
    deps:
      - check:security:prereqs
    cmds:
      - task: check:security:ggshield
      - task: check:security:trivy
      - task: check:security:owasp

  check:security:prereqs:
    desc: "Verify every security scanner is installed before running check:security."
    cmds:
      - cmd: |
          set -euo pipefail
          command -v ggshield >/dev/null 2>&1 || { echo "ggshield not found. Install: brew install gitguardian/tap/ggshield (or pip install ggshield)"; exit 1; }
          command -v trivy >/dev/null 2>&1 || { echo "trivy not found. Install: brew install trivy (or https://aquasecurity.github.io/trivy)"; exit 1; }

  # ─────────────────────────────────────────────────────────────────────── ggshield
  check:security:ggshield:
    desc: "Run ggshield secret scan over the repository (PII/secrets)."
    summary: |
      Runs a recursive GitGuardian secret scan over the whole repo, excluding
      build / dependency / result / git directories. IaC misconfiguration is
      covered by `check:security:trivy`. Outputs JSON to
      {{.SECURITY_RESULTS}}/ggshield.json and prints a human-readable summary.
    cmds:
      - cmd: |
          set -euo pipefail
          mkdir -p "{{.SECURITY_RESULTS}}"
          echo "=== ggshield PII / secret scan (repo root) ==="
          echo ""
          if ggshield secret scan path . --json \
              --recursive \
              --yes \
              --exclude _build \
              --exclude node_modules \
              --exclude dist \
              --exclude load-tests/results \
              --exclude "{{.SECURITY_RESULTS}}" \
              --exclude ".git" \
            > "{{.GGSHIELD_JSON}}" 2>&1; then
            echo "✅ PASS  ggshield secret scan (no secrets detected)"
          else
            echo "❌ FAIL  ggshield secret scan — secrets found:" >&2
            cat "{{.SECURITY_RESULTS}}/ggshield.json" >&2
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────── trivy
  check:security:trivy:
    desc: "Run trivy: filesystem vulnerabilities + IaC config + embedded-secrets."
    summary: |
      Two passes:
        1. Trivy filesystem scan (vulnerabilities). Targets the repo root and
           emits JSON to {{.SECURITY_RESULTS}}/trivy-fs.json.
        2. Trivy IaC config scan on infra/ — flags bad IAM / S3 / Lambda /
           security settings. Emits JSON to {{.SECURITY_RESULTS}}/trivy-iac.json.
    cmds:
      - cmd: |
          set -euo pipefail
          mkdir -p "{{.SECURITY_RESULTS}}"
          echo "=== trivy filesystem scan (repo root) ==="
          echo ""
          if trivy fs --exit-code 0 \
              --format json \
              --output "{{.TRIVY_FS_JSON}}" \
              . ; then
            n=$(grep -c '"Severity":"HIGH"\|"Severity":"CRITICAL"' "{{.TRIVY_FS_JSON}}" 2>/dev/null || true)
            if [ "${n:-0}" -gt 0 ]; then
              echo "⚠️   Found ${n} HIGH/CRITICAL fs vuln(s); see {{.TRIVY_FS_JSON}} for details"
            else
              echo "✅ PASS  trivy filesystem scan (no HIGH/CRITICAL vulns)"
            fi
          else
            echo "❌ FAIL  trivy filesystem scan failed to run" >&2
            exit 1
          fi
          echo ""
          echo "=== trivy IaC scan (infra/) ==="
          echo ""
          if trivy config --exit-code 0 \
              --format json \
              --output "{{.TRIVY_IAC_JSON}}" \
              "infra/" ; then
            n=$(grep -c '"Severity":"HIGH"\|"Severity":"CRITICAL"\|"Severity":"MEDIUM"' "{{.TRIVY_IAC_JSON}}" 2>/dev/null || true)
            if [ "${n:-0}" -gt 0 ]; then
              echo "⚠️   Found ${n} HIGH/CRITICAL/MEDIUM IaC finding(s); see {{.TRIVY_IAC_JSON}} for details"
              echo "  Review each finding — most are advisory; only treat as FAIL if you"
              echo "  want the gate to be strict. Set SECURITY_TRIVY_IACSTRICT=true to"
              echo ""
              echo "  enforce strict (fail-on-medium) gate."
              if [ "${SECURITY_TRIVY_IACSTRICT:-}" = "true" ]; then
                echo "  SECURITY_TRIVY_IACSTRICT=true was set — gate failing." >&2
                exit 1
              fi
            else
              echo "✅ PASS  trivy IaC scan (no HIGH/CRITICAL/MEDIUM)"
            fi
          else
            echo "❌ FAIL  trivy IaC scan failed to run" >&2
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────── owasp
  check:security:owasp:
    desc: "Validate OWASP Top 10 (2021) coverage — every item must have an in-tree control."
    summary: |
      The task hardens the repo before deploying, and the OWASP check makes
      sure the in-tree controls actually match the 2021 list. It runs
      assertions on the files (grep + file-exists) and prints a pass/fail per
      item. Exits non-zero only if a top-level control is missing entirely.

      Item evidence mapping:
        A01 Broken Access Control — lambda/lambda_handler.ml + infra/src/index.ts
        A02 Cryptographic Failures — lib/constant_time.ml + lib/constant_time_test.ml
        A03 Injection — lambda/lambda_handler.ml (input validation block)
        A04 Insecure Design — lib/ssrf.ml + lib/cohttp_backend.ml
        A05 Security Misconfiguration — server/server.ml + infra/src/index.ts
        A06 Outdated Components — Dockerfile.lambda (version pin)
        A07 Identification & Auth Failures — lib/cohttp_backend.ml (auth header)
        A08 Software Integrity — Dockerfile.lambda + lambda/dune (deps)
        A09 Security Logging — lib/log.ml (structured log module)
        A10 SSRF — lib/ssrf.ml (IP classifier)

      The task runs a series of assertions (grep + file-exists) to verify each
      control is present, and prints a per-item PASS/FAIL.
    cmds:
      - cmd: |
          set -euo pipefail
          mkdir -p "{{.SECURITY_RESULTS}}"
          fail=0
          pass=0

          # Helper: run an assertion — the first arg is the description, the rest
          # is the shell test. Exit on failure with an explicit FAIL marker.
          assert() {
            desc="$1"; shift
            if "$@" >/dev/null 2>&1; then
              echo "✅ PASS  OWASP $desc"
              pass=$((pass + 1))
            else
              echo "❌ FAIL  OWASP $desc"
              fail=$((fail + 1))
            fi
          }

          # ---- A01 Broken Access Control ----

          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "  OWASP Top 10 (2021) coverage check"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""
          echo "A01 — Broken Access Control"
          echo "───────────────────────────────────────────────────────────"

          assert "A01: x-api-key constant-time compare" test -f lib/constant_time.ml

          assert "A01: x-api-key auth in handler" \
            sh -c 'grep -q "Constant_time.equal" lambda/lambda_handler.ml'

          assert "A01: auth runs before business logic" \
            sh -c 'grep -q "unauthorized request" lambda/lambda_handler.ml'

          assert "A01: 401 on mismatch" \
            sh -c 'grep -q "json_error 401" lambda/lambda_handler.ml'

          assert "A01: fail-closed on weak key" \
            sh -c 'grep -q "key_bytes" lambda/lambda_handler.ml'

          assert "A01: key is Pulumi secret" \
            sh -c 'grep -q "requireSecret" infra/src/index.ts'

          assert "A01: unauthorized log line does NOT log the key" \
            sh -c '! grep -q "\"unauthorized request\".*provided" lambda/lambda_handler.ml && ! grep -q "\"unauthorized request\".*api_key" lambda/lambda_handler.ml'

          # ---- A02 Cryptographic Failures ----

          echo ""
          echo "A02 — Cryptographic Failures"
          echo "───────────────────────────────────────────────────────────"

          assert "A02: constant-time equal XOR-fold (no early-exit)" \
            sh -c 'grep -iq "xor-fold" lib/constant_time.ml || grep -q "acc := !acc lor" lib/constant_time.ml'

          assert "A02: constant-time equal test (unit)" \
            test -f lib/test/constant_time_test.ml

          assert "A02: key stored as Pulumi secret, never in source" \
            sh -c 'grep -q "requireSecret" infra/src/index.ts && ! grep -q "LAMBDA_API_KEY.*=\".*\"" lambda/main.ml'

          assert "A02: fail-closed on key too short" \
            sh -c 'grep -q "key_bytes" lambda/lambda_handler.ml'

          # ---- A03 Injection ----

          echo ""
          echo "A03 — Injection"
          echo "───────────────────────────────────────────────────────────"

          assert "A03: description length bounded" \
            sh -c 'grep -q "max_description_bytes" lambda/lambda_handler.ml'

          assert "A03: price >= 0" \
            sh -c 'grep -q "price must be >= 0" lambda/lambda_handler.ml'

          assert "A03: ref >= 0" \
            sh -c 'grep -q "ref must be >= 0" lambda/lambda_handler.ml'

          assert "A03: base64 decoded before JSON parse" \
            sh -c 'grep -q "decode_body" lambda/lambda_handler.ml && grep -q "isBase64Encoded" lambda/event.ml'

          # ---- A04 Insecure Design ----

          echo ""
          echo "A04 — Insecure Design"
          echo "───────────────────────────────────────────────────────────"

          assert "A04: SSRF check on resolved IP at dial time" \
            sh -c 'grep -q "check_ssrf_ip" lib/cohttp_backend.ml'

          assert "A04: listen addr validated" \
            sh -c 'grep -q "validate_listen_addr" server/cli.ml'

          assert "A04: base URL uses HTTPS" \
            sh -c 'grep -q "validate_base_url" lib/ssrf.ml'

          # ---- A05 Security Misconfiguration ----

          echo ""
          echo "A05 — Security Misconfiguration"
          echo "───────────────────────────────────────────────────────────"

          assert "A05: X-Content-Type-Options" \
            sh -c 'grep -q "X-Content-Type-Options" server/server.ml'

          assert "A05: X-Frame-Options" \
            sh -c 'grep -q "X-Frame-Options" server/server.ml'

          assert "A05: Content-Security-Policy" \
            sh -c 'grep -q "Content-Security-Policy" server/server.ml'

          assert "A05: IAM least-privilege (no broad data-plane access)" \
            sh -c 'grep -q "AWSLambdaBasicExecutionRole" infra/src/index.ts && ! grep -q "AmazonS3FullAccess" infra/src/index.ts'

          assert "A05: reserved concurrency limits concurrency pool" \
            sh -c 'grep -q "reservedConcurrentExecutions" infra/src/index.ts'

          # ---- A06 Outdated Components ----

          echo ""
          echo "A06 — Outdated Components"
          echo "───────────────────────────────────────────────────────────"

          assert "A06: Dockerfile.lambda pins OCaml version" \
            sh -c 'grep -q "ocaml/opam:debian-11-ocaml-4.14" Dockerfile.lambda'

          assert "A06: glibc-2.31 binary (forward-compatible with al2023 glibc-2.34)" \
            sh -c 'grep -q "glibc 2.31" Dockerfile.lambda || grep -q "glibc-2.31" Dockerfile.lambda || grep -q "debian-11" Dockerfile.lambda'

          # ---- A07 Identification & Authentication Failures ----

          echo ""
          echo "A07 — Identification and Authentication Failures"
          echo "───────────────────────────────────────────────────────────"

          assert "A07: auth via x-api-key header" \
            sh -c 'grep -q "x-api-key" lambda/lambda_handler.ml'

          assert "A07: constant-time compare in handler" \
            sh -c 'grep -q "Constant_time.equal" lambda/lambda_handler.ml'

          assert "A07: fail-closed on missing key" \
            sh -c 'grep -q "key_bytes" lambda/lambda_handler.ml'

          # ---- A08 Software and Data Integrity Failures ----

          echo ""
          echo "A08 — Software and Data Integrity Failures"
          echo "───────────────────────────────────────────────────────────"

          assert "A08: Lambda zip built via docker buildx (no local build)" \
            sh -c 'grep -q "docker buildx" infra/package.json'

          assert "A08: no test deps linked into bootstrap" \
            sh -c 'grep -q "lambda_lib" lambda/dune && ! grep -q "alcotest" lambda/dune'

          assert "A08: scratch carrier for final image" \
            sh -c 'grep -q "FROM scratch" Dockerfile.lambda'

          # ---- A09 Security Logging and Monitoring Failures ----

          echo ""
          echo "A09 — Security Logging and Monitoring Failures"
          echo "───────────────────────────────────────────────────────────"

          assert "A09: structured Log module (slog text format)" \
            test -f lib/log.ml

          assert "A09: Log module logs security events via structured fields" \
            sh -c 'grep -q "Log\\.log\\|Log\\.info\\|Log\\.warn\\|Log\\.error" lambda/lambda_handler.ml'

          assert "A09: api key value never appears in log payloads" \
            sh -c '! grep -q "Log\..*provided" lambda/lambda_handler.ml'

          # ---- A10 Server-Side Request Forgery (SSRF) ----

          echo ""
          echo "A10 — Server-Side Request Forgery"
          echo "───────────────────────────────────────────────────────────"

          assert "A10: SSRF IP classifier" \
            test -f lib/ssrf.ml

          assert "A10: check_ssrf_ip called on every resolved IP" \
            sh -c 'grep -q "check_ssrf_ip" lib/cohttp_backend.ml'

          assert "A10: refuses loopback" \
            sh -c 'grep -q "Ipaddr.Interface" lib/ssrf.ml'

          assert "A10: refuses private" \
            sh -c 'grep -q "Ipaddr.is_private" lib/ssrf.ml'

          assert "A10: refuses link-local" \
            sh -c 'grep -q "Ipaddr.Link" lib/ssrf.ml'

          assert "A10: refuses multicast" \
            sh -c 'grep -q "Ipaddr.is_multicast" lib/ssrf.ml'

          # ---- Summary ----

          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "  OWASP Top 10 coverage check summary"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""
          echo "Items passed: $pass    Items failed: $fail"
          echo ""
          if [ "$fail" -gt 0 ]; then
            echo "❌ OWASP Top 10 check FAILED — see FAIL lines above" >&2
            exit 1
          else
            echo "✅ OWASP Top 10 check PASSED — every item has in-tree evidence"
          fi

  check:security:report:
    desc: "Combine all security scan reports into a single JSON manifest."
    deps:
      - check:security:prereqs
    cmds:
      - task: check:security:ggshield
      - task: check:security:trivy
      - task: check:security:owasp
      - cmd: |
          set -euo pipefail
          mkdir -p "{{.SECURITY_RESULTS}}"
          {
            echo "{"
            echo '  "timestamp": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'",'
            echo '  "repo": "'$(basename "$(pwd)")'",'
            echo '  "scanners": ["ggshield","trivy","owasp"],'
            echo '  "reports": {'
            echo '    "ggshield": "{{.GGSHIELD_JSON}}",'
            echo '    "trivy_fs": "{{.TRIVY_FS_JSON}}",'
            echo '    "trivy_iac": "{{.TRIVY_IAC_JSON}}"'
            echo "  }"
            echo "}"
          } > "{{.SECURITY_RESULTS}}/manifest.json"
          echo "Security report manifest written to {{.SECURITY_RESULTS}}/manifest.json"

  check:security:clean:
    desc: "Remove generated security scan results."
    cmds:
      - |
        [ ! -d "{{.SECURITY_RESULTS}}" ] || rm -rf "{{.SECURITY_RESULTS}}"
        echo "Cleaned {{.SECURITY_RESULTS}}."
